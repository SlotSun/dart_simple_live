name: simple_live_app
version: 1.8.15+10815
publish_to: none
description: "Slive APP"
environment: 
  sdk: '>=3.0.5 <4.0.0'
  flutter: 3.50.0

dependencies: 
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter

  simple_live_core:
    path: ../simple_live_core
  # 图标
  remixicon: ^4.9.3 # Remix 图标

  # 框架、工具
  archive: ^4.3.0 # 文件压缩
  get: ^4.7.3 # 状态管理、路由管理、国际化
  dio: ^5.11.0 # 网络请求
  hive_ce: ^2.22.0 # 持久化存储
  hive_ce_flutter: ^2.5.0 # 持久化存储
  logger: ^2.8.0 # 日志
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1 # firebase
  firebase_core: ^5.1.0
  intl: ^0.20.2 # 国际化
  pinyin: ^3.3.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  qr_flutter: ^4.1.0 # 二维码生成
  dynamic_color: ^2.1.0 # 动态颜色
  path: any
  udp: ^5.0.3 # UDP
  fractional_indexing_dart: ^1.0.7 #分数索引
  synchronized: ^3.4.0 # 线程安全
  collection: ^1.19.1
  pool: ^1.5.3 #并发控制器
  material_ui: any
  cupertino_ui: any
  uuid: any

  # ffi
  rust_lib_simple_live_app:
    path: rust_builder
  flutter_rust_bridge: 2.14.0-beta.2

  # Widget
  flutter_staggered_grid_view: ^0.7.0 # 瀑布流 / GridView
  easy_refresh: ^4.0.0 # 下拉刷新、上拉加载
  extended_image: ^10.1.0 # 拓展 Image ，支持缓存
  flutter_smart_dialog: ^5.3.0 # 各种弹窗 Toast / Dialog / Popup
  sticky_headers: ^0.3.0+2 # 吸顶
  lottie: ^3.3.2 # Lottie 动画
  canvas_danmaku: ^0.3.4 # 弹幕库

  # 系统交互
  package_info_plus: ^10.2.2 # 包信息
  device_info_plus: ^13.3.0 # 设备信息
  url_launcher: ^6.3.2 # 打开链接
  share_plus: ^13.3.1 # 分享
  path_provider: ^2.1.6 # 常用路径
  cross_file: ^0.3.5+4 # 跨平台文件
  # permission_handler: ^12.0.1 # 权限处理
  permission_handler_apple: ^9.5.0
  permission_handler_android: ^13.0.1
  permission_handler_platform_interface: ^4.4.0
  flutter_image_gallery_saver: ^2.1.0 # 图片保存到相册
  screen_brightness_android: ^2.1.6
  screen_brightness_ios: ^2.1.4
  screen_brightness_platform_interface: ^2.1.2 #亮度控制
  auto_orientation_v2: 2.3.8 # 屏幕方向
  wakelock_plus: ^1.3.3 # 屏幕常亮
  file_picker: ^13.3.3 # 文件选择
  window_manager: ^0.5.0 # 窗口管理
  floating: ^6.0.0 # PIP 画中画
  flutter_inappwebview:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_inappwebview.git
      path: flutter_inappwebview
      ref: sbi_fx_pc/v6.2.0-beta.3
  connectivity_plus: ^7.3.2 # 网络状态
  qr_code_scanner_plus: ^2.4.1 # 二维码扫描
  flutter_secure_storage: ^11.2.0 # 密钥存储

  # 网络相关
  webdav_client: ^1.2.2 # WebDAV
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^8.2.2
  signalr_netcore: ^1.4.4 # SignalR

  # 视频播放
  volume_controller: ^3.7.1
  media_kit:
    git:
      url: https://github.com/SlotSun/media-kit.git
      ref: 06d441cd3d6da9c67ec5f99455004629482b53cb
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/SlotSun/media-kit.git
      ref: 06d441cd3d6da9c67ec5f99455004629482b53cb
      path: ./media_kit_video

dependency_overrides:
  get:
    git:
      url: https://github.com/SlotSun/get.git
      ref: master

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  hive_ce_generator: ^1.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_test: 
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter: 
  fonts:
    - family: iconfont
      fonts:
        - asset: assets/iconfont/live_icons.ttf
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/fonts/fonts-manifest.json
    - shorebird.yaml
